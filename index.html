    <style>
      body {
        font-family: 'Montserrat', sans-serif;
        background-color: #0a0a0a;
      }
      .font-cinzel {
        font-family: 'Cinzel', serif;
      }

      /* Shine effect for buttons on hover */
      .shine-hover {
        position: relative;
        overflow: hidden;
      }
      .shine-hover::before {
        content: '';
        position: absolute;
        top: 0;
        left: -150%;
        width: 50%;
        height: 100%;
        background: linear-gradient(
          100deg,
          rgba(253, 224, 71, 0) 0%,
          rgba(253, 224, 71, 0.25) 50%,
          rgba(253, 224, 71, 0) 100%
        );
        transform: skewX(-25deg);
        transition: left 0.8s cubic-bezier(0.23, 1, 0.32, 1);
      }
      .shine-hover:hover::before {
        left: 150%;
      }

      /* Golden Particles Animation */
      .particle-container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        overflow: hidden;
        z-index: 2; /* Sits above watermark (z-0) but below content (z-10) */
      }

      .gold-particle {
        position: absolute;
        bottom: -20px;
        background-color: #fde047; /* amber-300 */
        border-radius: 50%;
        animation: float-up linear infinite;
        box-shadow: 0 0 8px 2px rgba(253, 224, 71, 0.4);
      }

      @keyframes float-up {
        0% {
          transform: translateY(0);
        }
        100% {
          transform: translateY(-110vh);
          opacity: 0;
        }
      }

      /* Fade-in animation for procedure selection */
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .fade-in {
        animation: fadeIn 0.5s ease-out forwards;
      }

      /* Animated Gradient Card Background */
      @keyframes elegantGradient {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }
      .card-gradient-bg {
        background: linear-gradient(135deg, rgba(9, 9, 11, 0.95), rgba(24, 24, 27, 0.90), rgba(69, 52, 19, 0.4), rgba(9, 9, 11, 0.95));
        background-size: 300% 300%;
        animation: elegantGradient 12s ease infinite;
      }

      /* Custom Scrollbar Styles */
      ::-webkit-scrollbar {
        width: 10px;
      }
      ::-webkit-scrollbar-track {
        background: #18181b; /* zinc-900 */
      }
      ::-webkit-scrollbar-thumb {
        background-color: #fde047; /* amber-300 */
        border-radius: 20px;
        border: 2px solid #18181b; /* zinc-900, same as track */
      }
      ::-webkit-scrollbar-thumb:hover {
        background-color: #fbbf24; /* amber-400 */
      }
    </style>
